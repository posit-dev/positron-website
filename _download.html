<style>
    /* ============= DOWNLOAD PAGE CARDS ============= */
    .download-hero {
        background: white;
        border: 1px solid #3a78b1;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(87, 89, 89, 0.08);
        padding: 2rem;
        margin-bottom: 2rem;
        text-align: center;
    }

    .download-hero h3 {
        margin-top: 0;
        color: #242426;
        font-size: 1.3rem;
    }

    .download-hero .hero-subtitle {
        color: #707073;
        margin-bottom: 1.5rem;
        font-size: 0.95rem;
    }

    #hero-buttons {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
    }

    .download-hero .btn {
        padding: 1rem 2rem;
        min-width: 220px;
    }

    .hero-legal {
        font-size: 0.8rem;
        color: #707073;
        margin-top: 1rem;
        margin-bottom: 0;
    }

    .download-cards {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
        margin: 1.5rem 0;
        max-width: 100%;
    }

    .download-card {
        background: white;
        padding: 1.25rem;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(87, 89, 89, 0.08);
        border: 1px solid #3a78b1;
        height: 100%;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
    }

    .download-card:hover {
        box-shadow: 0 8px 30px rgba(87, 89, 89, 0.12);
    }

    .download-card h4 {
        margin-top: 0;
        margin-bottom: 1rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid #f0f0f0;
        font-size: 1.1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .download-card h4 .os-icon {
        font-size: 1.3rem;
    }

    .download-card .download-group {
        margin-bottom: 1rem;
    }

    .download-card .download-group:last-child {
        margin-bottom: 0;
    }

    .download-card .download-group > p {
        font-size: 0.85rem;
        color: #707073;
        margin-bottom: 0.25rem;
        padding-top: 0.5rem;
    }

    .download-card .download-group + .download-group > p {
        border-top: 1px solid #f0f0f0;
    }

    .download-card .download-option {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.4rem 0;
    }

    .download-card .download-option p {
        margin-bottom: 0;
    }

    .download-card .download-option .option-label {
        font-size: 0.95rem;
        color: #242426;
    }

    .download-card .download-option .option-meta {
        font-size: 0.8rem;
        color: #949494;
    }


    .download-card .download-option a.download-link {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        text-decoration: none;
        color: #3a78b1;
        font-size: 0.9rem;
        padding: 0.4rem 0.75rem;
        border-radius: 6px;
        border: 1px solid #d1dbe5;
        transition: background 0.2s, border-color 0.2s;
    }

    .download-card .download-option a.download-link:hover {
        background: #f0f6fb;
        border-color: #3a78b1;
    }

    .download-card .recommended-badge {
        display: inline-block;
        background: #3a78b1;
        color: white;
        font-size: 0.7rem;
        padding: 0.15rem 0.5rem;
        border-radius: 10px;
        margin-left: 0.5rem;
        vertical-align: middle;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
    }

    /* ============= LICENSE MODAL ============= */
    .license-modal-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 9998;
        opacity: 0;
        transition: opacity 0.2s;
    }

    .license-modal-backdrop.visible {
        opacity: 1;
    }

    .license-modal {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.95);
        background: white;
        border-radius: 12px;
        padding: 2rem;
        max-width: 480px;
        width: 90%;
        z-index: 9999;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        opacity: 0;
        transition: opacity 0.2s, transform 0.2s;
    }

    .license-modal.visible {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }

    .license-modal h3 {
        margin-top: 0;
        font-size: 1.2rem;
        color: #242426;
    }

    .license-modal p {
        color: #404041;
        font-size: 0.95rem;
        line-height: 1.6;
    }

    .license-modal .modal-actions {
        display: flex;
        gap: 0.75rem;
        margin-top: 1.5rem;
        justify-content: flex-end;
    }

    /* ============= CHECKSUMS SECTION ============= */
    .checksums-section summary {
        cursor: pointer;
        color: #3a78b1;
        font-weight: 500;
        padding: 0.5rem 0;
    }

    .checksums-section table {
        table-layout: fixed;
        width: 100%;
    }

    .checksums-section table th:nth-child(1),
    .checksums-section table td:nth-child(1) {
        width: 30%;
    }

    .checksums-section table th:nth-child(2),
    .checksums-section table td:nth-child(2) {
        width: 40%;
    }

    .checksums-section table th:nth-child(3),
    .checksums-section table td:nth-child(3) {
        width: 10%;
    }

    .checksums-section table th:nth-child(4),
    .checksums-section table td:nth-child(4) {
        width: 20%;
    }

    .checksum {
        cursor: pointer;
        color: rgba(var(--bs-link-color-rgb), var(--bs-link-opacity, 1));
        text-decoration: underline;
        position: relative;
        display: inline-block;
    }

    .copy-feedback {
        position: absolute;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        z-index: 1000;
        opacity: 0;
        transition: opacity 0.2s ease-in-out;
    }

    .copy-feedback.visible {
        opacity: 1;
    }


    /* ============= RESPONSIVE ============= */
    @media (min-width: 480px) {
        .download-cards {
            gap: 1.25rem;
            margin: 2rem 0;
        }

        .download-card {
            padding: 1.5rem;
        }
    }

    @media (min-width: 768px) {
        .download-cards {
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin: 2.5rem 0;
        }

        .download-card {
            padding: 1.75rem;
        }
    }

    @media (min-width: 1024px) {
        .download-cards {
            gap: 2rem;
            margin: 3rem 0;
        }

        .download-card {
            padding: 2rem;
        }
    }

    @media (min-width: 1400px) {
        .download-cards {
            grid-template-columns: repeat(3, 1fr);
        }
    }

    @media (max-width: 479px) {
        .download-card .download-option {
            padding: 0.5rem 0;
            gap: 0.75rem;
        }

        .download-card .download-option a.download-link {
            white-space: nowrap;
            flex-shrink: 0;
        }

        .download-hero {
            padding: 1.5rem 1rem;
        }
    }

    /* Used by install.qmd OS-detection buttons */
    .hidden {
        display: none !important;
    }

    #macos-buttons, #windows-buttons {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
    }
</style>

<noscript>
<style>
    .download-hero { display: none !important; }
</style>
</noscript>

<!-- License confirmation modal -->
<div class="license-modal-backdrop" id="license-backdrop" onclick="closeLicenseModal()"></div>
<div class="license-modal" id="license-modal" role="dialog" aria-modal="true" aria-labelledby="license-modal-title">
    <h3 id="license-modal-title">Accept license agreement</h3>
    <p>Please review <a href="licensing.html">Positron's license agreement</a> and <a href="https://posit.co/about/privacy-policy/">privacy policy</a>. Your acceptance of this license agreement and privacy policy is required as a condition to proceeding with your download or use of the software.</p>
    <div class="modal-actions">
        <button class="btn btn-outline-secondary" onclick="closeLicenseModal()">Cancel</button>
        <button class="btn btn-primary" onclick="acceptAndDownload()">I Agree &amp; Download</button>
    </div>
</div>

<script type="application/javascript">
    let pendingDownloadUrl = null;
    let licenseAccepted = false;

    window.document.addEventListener("DOMContentLoaded", () => {
        detectOS();
        bindDownloadTriggers();
        setupOSDetection();
    });

    function detectOS() {
        const heroSection = document.getElementById('download-hero');
        if (!heroSection) return;

        const heroTitle = document.getElementById('hero-title');
        const heroSubtitle = document.getElementById('hero-subtitle');
        const heroBtns = document.getElementById('hero-buttons');

        const userAgent = navigator.userAgent;
        const version = heroSection.dataset.version;
        const cdnUrl = 'https://cdn.posit.co/positron/releases/';

        if (userAgent.indexOf('Mac') !== -1) {
            heroTitle.textContent = 'Recommended for your Mac';
            heroSubtitle.textContent = 'We detected macOS. Choose your chip:';
            heroBtns.innerHTML = `
                <a href="${cdnUrl}mac/arm64/Positron-${version}-arm64.dmg" class="btn btn-primary download-trigger">
                    Download for Apple Silicon
                </a>
                <a href="${cdnUrl}mac/x64/Positron-${version}-x64.dmg" class="btn btn-outline-primary download-trigger">
                    Download for Intel
                </a>
            `;
            highlightCard('card-macos');
        } else if (userAgent.indexOf('Win') !== -1) {
            heroTitle.textContent = 'Recommended for your PC';
            heroSubtitle.textContent = 'We detected Windows. Choose your architecture:';
            heroBtns.innerHTML = `
                <a href="${cdnUrl}win/x86_64/Positron-${version}-UserSetup-x64.exe" class="btn btn-primary download-trigger">
                    Download for x64
                </a>
                <a href="${cdnUrl}win/arm64/Positron-${version}-UserSetup-arm64.exe" class="btn btn-outline-primary download-trigger">
                    Download for ARM64
                </a>
            `;
            highlightCard('card-windows');
        } else if (userAgent.indexOf('Linux') !== -1) {
            heroTitle.textContent = 'Recommended for your system';
            heroSubtitle.textContent = 'We detected Linux. Choose your package format:';
            heroBtns.innerHTML = `
                <a href="${cdnUrl}deb/x86_64/Positron-${version}-x64.deb" class="btn btn-primary download-trigger">
                    Download .deb (x64)
                </a>
                <a href="${cdnUrl}rpm/x86_64/Positron-${version}-x64.rpm" class="btn btn-outline-primary download-trigger">
                    Download .rpm (x64)
                </a>
            `;
            highlightCard('card-linux');
        } else {
            heroSection.style.display = 'none';
        }

        bindDownloadTriggers();
    }

    function highlightCard(cardId) {
        const card = document.getElementById(cardId);
        if (card) {
            const heading = card.querySelector('h4');
            if (heading) {
                const badge = document.createElement('span');
                badge.className = 'recommended-badge';
                badge.textContent = 'Your OS';
                heading.appendChild(badge);
            }
        }
    }

    function bindDownloadTriggers() {
        document.querySelectorAll('.download-trigger').forEach(link => {
            link.removeEventListener('click', handleDownloadClick);
            link.addEventListener('click', handleDownloadClick);
        });
    }

    function handleDownloadClick(e) {
        if (licenseAccepted) return;
        e.preventDefault();
        pendingDownloadUrl = e.currentTarget.href;
        openLicenseModal();
    }

    function openLicenseModal() {
        const backdrop = document.getElementById('license-backdrop');
        const modal = document.getElementById('license-modal');
        backdrop.style.display = 'block';
        modal.style.display = 'block';
        requestAnimationFrame(() => {
            backdrop.classList.add('visible');
            modal.classList.add('visible');
        });
        modal.querySelector('.btn-primary').focus();
        document.addEventListener('keydown', handleModalKeydown);
    }

    function closeLicenseModal() {
        const backdrop = document.getElementById('license-backdrop');
        const modal = document.getElementById('license-modal');
        backdrop.classList.remove('visible');
        modal.classList.remove('visible');
        setTimeout(() => {
            backdrop.style.display = 'none';
            modal.style.display = 'none';
        }, 200);
        document.removeEventListener('keydown', handleModalKeydown);
        pendingDownloadUrl = null;
    }

    function handleModalKeydown(e) {
        if (e.key === 'Escape') {
            closeLicenseModal();
        }
    }

    function acceptAndDownload() {
        licenseAccepted = true;
        closeLicenseModal();
        if (pendingDownloadUrl) {
            window.location.href = pendingDownloadUrl;
        }
    }

    // Used by install.qmd for OS-detected download buttons
    function setupOSDetection() {
        const downloadBtn = document.getElementById('download-btn');
        const osName = document.getElementById('os-name');
        const allDownloads = document.getElementById('all-downloads');

        if (!downloadBtn || !osName) {
            return;
        }

        const version = downloadBtn.dataset.version;
        const cdnUrl = 'https://cdn.posit.co/positron/releases/';
        const userAgent = navigator.userAgent;

        let detectedOS = '';
        let downloadUrl = '';
        let allDownloadsText = null;

        if (userAgent.indexOf('Win') !== -1) {
            const winButtons = document.getElementById('windows-buttons');
            const winX64Btn = document.getElementById('download-btn-win-x64');
            const winArm64Btn = document.getElementById('download-btn-win-arm64');

            if (winButtons && winX64Btn && winArm64Btn) {
                downloadBtn.style.display = 'none';
                winButtons.classList.remove('hidden');
                winX64Btn.href = `${cdnUrl}win/x86_64/Positron-${version}-UserSetup-x64.exe`;
                winArm64Btn.href = `${cdnUrl}win/arm64/Positron-${version}-UserSetup-arm64.exe`;
            }
            detectedOS = 'for Windows';
            allDownloadsText = 'System Installer & Other Platforms';
        } else if (userAgent.indexOf('Mac') !== -1) {
            const macButtons = document.getElementById('macos-buttons');
            const macArmBtn = document.getElementById('download-btn-mac-arm');
            const macIntelBtn = document.getElementById('download-btn-mac-intel');

            if (macButtons && macArmBtn && macIntelBtn) {
                downloadBtn.style.display = 'none';
                macButtons.classList.remove('hidden');
                macArmBtn.href = `${cdnUrl}mac/arm64/Positron-${version}-arm64.dmg`;
                macIntelBtn.href = `${cdnUrl}mac/x64/Positron-${version}-x64.dmg`;
            }
            detectedOS = 'for macOS';
            allDownloadsText = 'Other Platforms';
        } else if (userAgent.indexOf('Linux') !== -1) {
            detectedOS = 'for Linux';
            downloadUrl = 'download.html';
        } else {
            detectedOS = '';
            downloadUrl = 'download.html';
        }

        osName.textContent = detectedOS;
        if (downloadUrl) {
            downloadBtn.href = downloadUrl;
        }

        if (allDownloadsText && allDownloads) {
            allDownloads.textContent = allDownloadsText;
        } else if (allDownloads) {
            allDownloads.hidden = true;
        }

        bindDownloadTriggers();
    }

    function copyChecksum(text, element) {
        const existingFeedback = element.querySelector('.copy-feedback');
        if (existingFeedback) {
            existingFeedback.remove();
        }

        const feedback = document.createElement('div');
        feedback.className = 'copy-feedback';
        feedback.textContent = 'Copied!';
        element.appendChild(feedback);

        navigator.clipboard.writeText(text).then(() => {
            requestAnimationFrame(() => {
                feedback.classList.add('visible');
                setTimeout(() => {
                    feedback.classList.remove('visible');
                    setTimeout(() => { feedback.remove(); }, 200);
                }, 1000);
            });
        }).catch((err) => {
            console.error('Failed to copy text: ', err);
            feedback.textContent = 'Failed to copy';
            feedback.classList.add('visible');
            setTimeout(() => {
                feedback.classList.remove('visible');
                setTimeout(() => { feedback.remove(); }, 200);
            }, 1000);
        });
    }
</script>
