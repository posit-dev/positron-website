<style>
    /* ============= DOWNLOAD PAGE CARDS ============= */
    .download-hero {
        background: white;
        border: 1px solid #3a78b1;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(87, 89, 89, 0.08);
        padding: 2rem;
        margin-bottom: 2rem;
        text-align: center;
    }

    .download-hero h3 {
        margin-top: 0;
        color: #242426;
        font-size: 1.25rem;
    }

    .download-hero .hero-subtitle {
        color: #707073;
        margin-bottom: 1.5rem;
        font-size: 0.95rem;
    }

    #hero-buttons {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
    }

    .download-hero .btn {
        padding: 1rem 2rem;
        min-width: 220px;
    }

    .hero-legal {
        font-size: 0.95rem;
        color: #707073;
        margin-top: 1rem;
        margin-bottom: 0;
    }

    .download-cards {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
        margin: 1.5rem 0;
        max-width: 100%;
    }

    .download-card {
        background: white;
        padding: 1.25rem;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(87, 89, 89, 0.08);
        border: 1px solid #3a78b1;
        height: 100%;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
    }

    .download-card:hover {
        box-shadow: 0 8px 30px rgba(87, 89, 89, 0.12);
    }

    .download-card h4 {
        margin-top: 0;
        margin-bottom: 1rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid #f0f0f0;
        font-size: 1.1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .download-card .download-group {
        margin-bottom: 1rem;
    }

    .download-card .download-group:last-child {
        margin-bottom: 0;
    }

    .download-card .download-group > p {
        font-size: 0.9rem;
        color: #707073;
        margin-bottom: 0.25rem;
        padding-top: 0.5rem;
    }

    .download-card .download-group + .download-group > p {
        border-top: 1px solid #f0f0f0;
    }

    .download-card .download-option {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.4rem 0;
    }

    /* Pandoc wraps each interpolated download link in a <p>; drop its margin
       so the link stays vertically centered in the flex row. */
    .download-card .download-option p {
        margin-bottom: 0;
    }

    .download-card .download-option .option-label {
        font-size: 0.95rem;
        color: #242426;
    }

    .download-card .download-option .option-meta {
        font-size: 0.75rem;
        color: #949494;
    }


    .download-card .download-option a.download-link {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        text-decoration: none;
        color: #3a78b1;
        font-size: 0.9rem;
        padding: 0.4rem 0.75rem;
        border-radius: 6px;
        border: 1px solid #d1dbe5;
        transition: background 0.2s, border-color 0.2s;
    }

    .download-card .download-option a.download-link:hover {
        background: #f0f6fb;
        border-color: #3a78b1;
    }

    .download-card .recommended-badge {
        display: inline-block;
        background: #3a78b1;
        color: white;
        font-size: 0.75rem;
        padding: 0.2rem 0.5rem;
        border-radius: 10px;
        white-space: nowrap;
        flex-shrink: 0;
        vertical-align: middle;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
    }


    /* ============= CHECKSUMS SECTION ============= */
    .checksums-section {
        margin-bottom: 1.5rem;
    }

    .checksums-section summary {
        cursor: pointer;
        color: #3a78b1;
        font-weight: 500;
        padding: 0.5rem 0;
    }

    .checksums-section table {
        table-layout: fixed;
        width: 100%;
    }

    .checksums-section table th:nth-child(1),
    .checksums-section table td:nth-child(1) {
        width: 30%;
    }

    .checksums-section table th:nth-child(2),
    .checksums-section table td:nth-child(2) {
        width: 40%;
    }

    .checksums-section table th:nth-child(3),
    .checksums-section table td:nth-child(3) {
        width: 10%;
    }

    .checksums-section table th:nth-child(4),
    .checksums-section table td:nth-child(4) {
        width: 20%;
    }

    .checksum {
        cursor: pointer;
        color: rgba(var(--bs-link-color-rgb), var(--bs-link-opacity, 1));
        text-decoration: underline;
        position: relative;
        display: inline-block;
    }

    .copy-feedback {
        position: absolute;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        z-index: 1000;
        opacity: 0;
        transition: opacity 0.2s ease-in-out;
    }

    .copy-feedback.visible {
        opacity: 1;
    }


    /* ============= RESPONSIVE ============= */
    @media (min-width: 480px) {
        .download-cards {
            gap: 1.25rem;
            margin: 2rem 0;
        }

        .download-card {
            padding: 1.5rem;
        }
    }

    @media (min-width: 768px) {
        .download-cards {
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin: 2.5rem 0;
        }

        .download-card {
            padding: 1.75rem;
        }
    }

    @media (min-width: 1024px) {
        .download-cards {
            gap: 2rem;
            margin: 3rem 0;
        }

        .download-card {
            padding: 2rem;
        }
    }

    @media (min-width: 1400px) {
        .download-cards {
            grid-template-columns: repeat(3, 1fr);
        }
    }

    @media (max-width: 479px) {
        .download-card .download-option {
            padding: 0.5rem 0;
            gap: 0.75rem;
        }

        .download-card .download-option a.download-link {
            white-space: nowrap;
            flex-shrink: 0;
        }

        .download-hero {
            padding: 1.5rem 1rem;
        }
    }

    /* ============= LICENSE AGREEMENT DIALOG ============= */
    dialog#license-dialog {
        max-width: 420px;
        padding: 1.5rem;
        border: none;
        border-radius: 8px;
        background: white;
        color: #242426;
        box-shadow: 0 8px 30px rgba(87, 89, 89, 0.2);
    }

    dialog#license-dialog::backdrop {
        background: rgba(0, 0, 0, 0.4);
    }

    /* Explicit classes, not bare `h2`/`p`: theme.scss:58 forces
       `font-weight: 400 !important` on every heading, and the dialog title is
       not part of the page's heading outline anyway. */
    dialog#license-dialog .license-dialog-title {
        margin-top: 0;
        margin-bottom: 0.75rem;
        font-size: 1.05rem;
        font-weight: 600;
        color: #242426;
    }

    dialog#license-dialog .license-dialog-body {
        margin-bottom: 0;
        font-size: 0.9rem;
        color: #707073;
    }

    dialog#license-dialog a {
        color: #3a78b1;
    }

    .license-dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        margin-top: 1.5rem;
    }

    /* Keep the default `margin: auto` so showModal() still centers the dialog;
       only constrain the width on narrow viewports. */
    @media (max-width: 479px) {
        dialog#license-dialog {
            max-width: calc(100vw - 2rem);
        }
    }
</style>

<noscript>
<style>
    .download-hero { display: none !important; }
</style>
</noscript>

<script type="application/javascript">
    window.document.addEventListener("DOMContentLoaded", () => {
        detectOS();
        setupLicenseGate();
    });

    function detectOS() {
        const heroSection = document.getElementById('download-hero');
        if (!heroSection) return;

        const heroTitle = document.getElementById('hero-title');
        const heroSubtitle = document.getElementById('hero-subtitle');
        const heroBtns = document.getElementById('hero-buttons');

        const userAgent = navigator.userAgent;
        const version = heroSection.dataset.version;
        const cdnUrl = 'https://cdn.posit.co/positron/releases/';

        if (userAgent.indexOf('Mac') !== -1) {
            heroTitle.textContent = 'Recommended for your Mac';
            heroSubtitle.textContent = 'We detected macOS. Choose your chip:';
            heroBtns.innerHTML = `
                <a href="${cdnUrl}mac/arm64/Positron-${version}-arm64.dmg" class="btn btn-primary">
                    Download for Apple Silicon
                </a>
                <a href="${cdnUrl}mac/x64/Positron-${version}-x64.dmg" class="btn btn-outline-primary">
                    Download for Intel
                </a>
            `;
            highlightCard('card-macos');
        } else if (userAgent.indexOf('Win') !== -1) {
            heroTitle.textContent = 'Recommended for your PC';
            heroSubtitle.textContent = 'We detected Windows. Choose your architecture:';
            heroBtns.innerHTML = `
                <a href="${cdnUrl}win/x86_64/Positron-${version}-UserSetup-x64.exe" class="btn btn-primary">
                    Download for x64
                </a>
                <a href="${cdnUrl}win/arm64/Positron-${version}-UserSetup-arm64.exe" class="btn btn-outline-primary">
                    Download for ARM64
                </a>
            `;
            highlightCard('card-windows');
        } else if (userAgent.indexOf('Linux') !== -1) {
            heroTitle.textContent = 'Recommended for your system';
            heroSubtitle.textContent = 'We detected Linux. Choose your package format:';
            heroBtns.innerHTML = `
                <a href="${cdnUrl}deb/x86_64/Positron-${version}-x64.deb" class="btn btn-primary">
                    Download .deb (x64)
                </a>
                <a href="${cdnUrl}rpm/x86_64/Positron-${version}-x64.rpm" class="btn btn-outline-primary">
                    Download .rpm (x64)
                </a>
            `;
            highlightCard('card-linux');
        } else {
            heroSection.style.display = 'none';
        }

    }

    function highlightCard(cardId) {
        const card = document.getElementById(cardId);
        if (card) {
            const heading = card.querySelector('h4');
            if (heading) {
                const badge = document.createElement('span');
                badge.className = 'recommended-badge';
                badge.textContent = 'Your OS';
                heading.appendChild(badge);
            }
        }
    }

    const LICENSE_CONSENT_KEY = 'positron-license-accepted';
    const INSTALLER_PREFIX = 'https://cdn.posit.co/positron/releases/';
    const INSTALLER_EXTENSIONS = ['.exe', '.dmg', '.deb', '.rpm'];

    let licenseDialog = null;
    let pendingDownload = null;

    function hasSessionConsent() {
        try {
            return window.sessionStorage.getItem(LICENSE_CONSENT_KEY) === 'true';
        } catch (err) {
            // Storage blocked (private browsing, blocked cookies). Treat as no
            // consent on record: the reader is re-prompted, never blocked.
            return false;
        }
    }

    function rememberSessionConsent() {
        try {
            window.sessionStorage.setItem(LICENSE_CONSENT_KEY, 'true');
        } catch (err) {
            // Consent still applies to the download in flight; the next one
            // re-prompts.
        }
    }

    function buildLicenseDialog() {
        const dialog = document.createElement('dialog');
        if (typeof dialog.showModal !== 'function') {
            return null;
        }

        dialog.id = 'license-dialog';
        dialog.setAttribute('aria-labelledby', 'license-dialog-title');
        dialog.setAttribute('aria-describedby', 'license-dialog-body');
        dialog.innerHTML = `
            <p id="license-dialog-title" class="license-dialog-title">Accept license agreement</p>
            <p id="license-dialog-body" class="license-dialog-body">
                Please review the Positron <a href="licensing.html">license agreement</a> and
                <a href="https://posit.co/about/privacy-policy/">privacy policy</a>. Your
                acceptance of this license agreement and privacy policy is required as a
                condition to proceeding with your download or use of the software.
            </p>
            <div class="license-dialog-actions">
                <button type="button" class="btn btn-outline-primary" id="license-dialog-cancel" autofocus>Cancel</button>
                <button type="button" class="btn btn-primary" id="license-dialog-agree">I Agree &amp; Download</button>
            </div>
        `;

        document.body.appendChild(dialog);

        dialog.querySelector('#license-dialog-cancel').addEventListener('click', () => {
            dialog.close();
        });

        dialog.querySelector('#license-dialog-agree').addEventListener('click', () => {
            // Capture the link before close(), because the 'close' handler
            // clears pendingDownload.
            const link = pendingDownload;
            rememberSessionConsent();
            dialog.close();
            if (link) {
                link.dataset.licenseAccepted = 'true';
                link.click();
            }
        });

        // Fires for Cancel and for Escape, which bypasses both buttons.
        dialog.addEventListener('close', () => {
            pendingDownload = null;
        });

        return dialog;
    }

    // Single entry point for opening the dialog, so initial focus is the same
    // however it was triggered. The `autofocus` attribute on Cancel is not
    // honored here: the body paragraph's links precede the buttons and win the
    // dialog focusing steps, so move focus explicitly to the dismissive action.
    function openLicenseDialog(dialog) {
        dialog.showModal();
        const cancel = dialog.querySelector('#license-dialog-cancel');
        if (cancel) {
            cancel.focus();
        }
    }

    function isGatedDownload(anchor) {
        // getAttribute, not .href: read the literal authored URL rather than a
        // browser-resolved one.
        const href = anchor.getAttribute('href') || '';
        if (href.indexOf(INSTALLER_PREFIX) !== 0) {
            return false;
        }
        return INSTALLER_EXTENSIONS.some((extension) => href.endsWith(extension));
    }

    function setupLicenseGate() {
        licenseDialog = buildLicenseDialog();
        if (!licenseDialog) {
            // No <dialog> support: leave every download exactly as it is.
            return;
        }

        document.addEventListener('click', (event) => {
            if (event.defaultPrevented) {
                return;
            }

            // Let modifier and middle clicks keep their native behavior, such
            // as opening in a new tab.
            if (event.button !== 0 || event.metaKey || event.ctrlKey ||
                event.shiftKey || event.altKey) {
                return;
            }

            const anchor = event.target.closest ? event.target.closest('a') : null;
            if (!anchor || !isGatedDownload(anchor)) {
                return;
            }

            // The replayed click from the Agree button. Clear the flag and let
            // the browser follow the href so Plausible sees a real click.
            if (anchor.dataset.licenseAccepted === 'true') {
                delete anchor.dataset.licenseAccepted;
                return;
            }

            if (hasSessionConsent()) {
                return;
            }

            event.preventDefault();
            pendingDownload = anchor;
            openLicenseDialog(licenseDialog);
        });
    }

    function copyChecksum(text, element) {
        const existingFeedback = element.querySelector('.copy-feedback');
        if (existingFeedback) {
            existingFeedback.remove();
        }

        const feedback = document.createElement('div');
        feedback.className = 'copy-feedback';
        feedback.textContent = 'Copied!';
        element.appendChild(feedback);

        navigator.clipboard.writeText(text).then(() => {
            requestAnimationFrame(() => {
                feedback.classList.add('visible');
                setTimeout(() => {
                    feedback.classList.remove('visible');
                    setTimeout(() => { feedback.remove(); }, 200);
                }, 1000);
            });
        }).catch((err) => {
            console.error('Failed to copy text: ', err);
            feedback.textContent = 'Failed to copy';
            feedback.classList.add('visible');
            setTimeout(() => {
                feedback.classList.remove('visible');
                setTimeout(() => { feedback.remove(); }, 200);
            }, 1000);
        });
    }
</script>
