project:
  title: "Positron"
  type: website
  render:
    - "*.qmd"
  resources:
    # Videos are served from cdn.posit.co, never from the built site. Excluding
    # them here keeps them out of every profile's output and out of the docs
    # bundles published by release-docs-bundles.yml. See videos/README.md.
    - "!videos/**"

execute:
  freeze: auto

website:
  llms-txt: true
  site-url: "https://positron.posit.co"
  image: "images/positron-social.png"
  image-alt: "Positron: a next generation data science IDE"
  open-graph: true
  twitter-card:
    card-style: summary_large_image

profile:
  group: 
    - [positron, workbench]
