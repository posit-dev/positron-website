name: Build and deploy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded runs for PRs; let main-branch publishes finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Render docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get Quarto version
        id: get-quarto-version
        run: |
          QUARTO_VERSION="$(tr -d '[:space:]' < .quarto-version)"
          echo "quarto_version=${QUARTO_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ steps.get-quarto-version.outputs.quarto_version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No R or Python needed: computed pages are served from committed _freeze.
      - name: Render public Positron docs
        uses: quarto-dev/quarto-actions/render@v2
        env:
          QUARTO_PROFILE: positron

      - name: Upload _site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

      # Dailies (dev docs) are only published from main, so only build them there.
      - name: Render dailies docs
        if: github.event_name == 'push'
        uses: quarto-dev/quarto-actions/render@v2
        env:
          QUARTO_PROFILE: dailies,positron

      - name: Upload _site-dailies artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: site-dailies
          path: _site-dailies

  preview:
    name: Deploy PR preview to Netlify
    needs: build
    # PRs only, and skip fork PRs since they can't access secrets.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
      - name: Download _site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: _site
          production-deploy: false
          deploy-message: "Preview for PR #${{ github.event.number }}"
          alias: pr-${{ github.event.number }}
          # We post our own comment below, which also lists the changed pages.
          enable-pull-request-comment: false
          enable-commit-comment: false
          github-deployment-environment: preview
          # The action reads the token from this input, not from env.
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

      - name: Comment preview links on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          export PREVIEW="https://pr-${PR_NUMBER}--positron-website-preview.netlify.app"

          # Top-level .qmd pages only. Files starting with _ are partials, not pages.
          PAGES="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '
            .[] | select(.status != "removed")
            | .filename | select(test("^[^_/][^/]*\\.qmd$"))
            | sub("\\.qmd$"; ".html") | sub("^index\\.html$"; "")
            | "- \(env.PREVIEW)/\(.)"')"

          {
            echo "<!-- pr-preview-comment -->"
            echo "### Preview"
            echo
            echo "Deployed ${HEAD_SHA:0:7} to ${PREVIEW}"
            if [ -n "$PAGES" ]; then
              printf '\nChanged pages:\n\n%s\n' "$PAGES"
            fi
          } > comment.md

          # Update our earlier comment if there is one, otherwise create it.
          COMMENT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '[.[] | select(.body | contains("<!-- pr-preview-comment -->"))][0].id // empty')"
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -F body=@comment.md
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@comment.md
          fi

  publish-dailies:
    name: Publish dailies to gh-pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Shared with the publish-site job in release-docs-bundles.yml: two
    # workflows now write to gh-pages, and both push with --force, so a release
    # publish overlapping a merge to main could drop the other's commit. Queue
    # them instead of cancelling, so neither publish is lost.
    concurrency: gh-pages-deploy
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download _site-dailies artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dailies
          path: _site-dailies

      # Matches the publish-site job in release-docs-bundles.yml
      - name: Publish to gh-pages under /dailies
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site-dailies
          target-folder: dailies
          branch: gh-pages
          clean: true
          commit-message: "Deploy dailies for ${{ github.sha }}"
